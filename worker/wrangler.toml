name = "claria"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Binding de Workers AI (solo se usa si AI_PROVIDER = "workers-ai"). No requiere clave.
[ai]
binding = "AI"

[vars]
# Proveedor: "workers-ai" (sin clave, cuota gratuita diaria), "anthropic" o "gemini" (requieren secreto, ver docs/PUBLICACION.md)
AI_PROVIDER = "workers-ai"
# Modelo. Para workers-ai elegí uno disponible en el plan gratuito (lista en el panel de Cloudflare) y verificalo con `npm run smoke`.
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Orígenes que pueden llamar a la API (separados por coma). Cambiá TU-USUARIO.
ALLOWED_ORIGINS = "https://beludellamea-cmyk.github.io,http://localhost:8000,http://127.0.0.1:8000"
# Límites (por persona, anónimos por huella de IP; y total diario)
RATE_PER_MIN = "6"
RATE_PER_DAY = "40"
DAILY_CAP = "300"

# Visión (analizar imágenes con IA: ruta /api/vision). Se activa solo si existe el secreto de la clave (wrangler secret put GEMINI_API_KEY).
# Sin la clave, /api/health informa vision.enabled=false y la app oculta la opción. Ver docs/ETAPAS.md (Etapa 8).
VISION_PROVIDER = "gemini"
# Verificá el nombre del modelo vigente en Google AI Studio antes de publicar.
VISION_MODEL = "gemini-3.5-flash"
# "free" = clave gratuita (Google puede usar lo enviado para mejorar sus productos: la app lo avisa antes de enviar). Con facturación activada, cambialo a "paid".
GEMINI_TIER = "free"
VISION_PER_MIN = "4"
VISION_PER_DAY = "15"
VISION_DAILY_CAP = "100"

# Opcional (recomendado) para que los límites diarios sean exactos entre servidores de Cloudflare:
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "PEGAR_ID_DEL_KV"
